<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b1a">
  <meta name="description" content="hysquib 的数字名片：开发者、写作者，以及一个构建事物的人。">
  <title>hysquib · 数字名片</title>
  <style>
    :root{color-scheme:dark;--bg:#101b1a;--panel:#172522;--line:#355148;--text:#f4f0e8;--muted:#afbeb2;--accent:#b5e3ad}
    *{box-sizing:border-box}
    html{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    body{margin:0;min-height:100svh;background:radial-gradient(circle at 85% 5%,#274c3d 0,transparent 42%),var(--bg)}
    a{color:inherit}
    .shell{max-width:580px;margin:auto;padding:32px 22px 48px}
    .top{display:flex;align-items:center;justify-content:space-between;color:var(--accent);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase}
    .top .mark{display:flex;align-items:center;gap:9px}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
    .card{margin-top:52px;padding:32px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#20342d,var(--panel) 70%);box-shadow:0 28px 70px #0005;position:relative;overflow:hidden}
    .card:after{content:"✳";position:absolute;right:-15px;top:-65px;font-size:250px;line-height:1;color:#b5e3ad0c;pointer-events:none}
    .eyebrow{color:var(--accent);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:26px 0 8px;font-size:clamp(3.3rem,13vw,5.4rem);line-height:1;letter-spacing:-.07em;font-weight:650}
    .role{font-size:1.05rem;color:var(--muted);margin:0}
    .rule{height:1px;background:var(--line);margin:38px 0 27px}
    .intro{max-width:34ch;font-size:1.12rem;line-height:1.85;margin:0}
    .intro strong{color:var(--accent);font-weight:600}
    .section-title{margin:44px 0 16px;color:var(--muted);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase}
    .links{display:grid;gap:11px}
    .link{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px;padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:#ffffff07;text-decoration:none;transition:background .2s,border-color .2s,transform .2s}
    .link:hover,.link:focus-visible{background:#b5e3ad13;border-color:var(--accent);transform:translateY(-2px)}
    .link:focus-visible,.save:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .link b{display:block;font-size:1rem;font-weight:600}.link small{display:block;margin-top:4px;color:var(--muted);font-size:.82rem}
    .arrow{color:var(--accent);font-size:1.5rem;line-height:1}
    .save{width:100%;margin-top:22px;min-height:60px;border:0;border-radius:16px;background:var(--accent);color:#102019;font:700 1rem system-ui,-apple-system,sans-serif;cursor:pointer;transition:filter .2s}
    .save:hover{filter:brightness(1.1)}
    footer{padding-top:36px;text-align:center;color:var(--muted);font-size:.77rem;letter-spacing:.08em}
    @media(max-width:420px){.shell{padding:25px 16px 36px}.card{margin-top:35px;padding:25px}.intro{font-size:1rem}}
    @media(prefers-reduced-motion:reduce){.link,.save{transition:none}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><span class="mark"><span class="dot"></span> DIGITAL CARD</span><span>HYSQUIB / NFC</span></div>
    <section class="card" aria-labelledby="name">
      <span class="eyebrow">你好，很高兴认识你</span>
      <h1 id="name">hysquib<span style="color:var(--accent)">.</span></h1>
      <p class="role">开发者 · 写作者 · 思考者</p>
      <div class="rule"></div>
      <p class="intro">我是一个<strong>构建事物的人</strong>。写技术、设计，也记录关于创造有意义事物的思考。</p>
    </section>
    <h2 class="section-title">继续了解 / 联系</h2>
    <nav class="links" aria-label="个人链接">
      <a class="link" href="https://blog.hysquib.cn/"><span><b>个人网站</b><small>文章、项目与更多介绍</small></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="link" href="https://github.com/hysquib"><span><b>GitHub</b><small>看看我构建的东西</small></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="link" href="mailto:hello@hysquib.cn"><span><b>发邮件</b><small>hello@hysquib.cn</small></span><span class="arrow" aria-hidden="true">↗</span></a>
    </nav>
    <button class="save" id="save" type="button">保存联系方式 ↓</button>
    <footer>HYSQUIB · 很高兴与你相遇</footer>
  </main>
  <script>
    document.getElementById('save').addEventListener('click',function(){
      const card=['BEGIN:VCARD','VERSION:3.0','FN:hysquib','EMAIL;TYPE=INTERNET:hello@hysquib.cn','URL:https://blog.hysquib.cn/','NOTE:GitHub https://github.com/hysquib','END:VCARD'].join('\r\n');
      const url=URL.createObjectURL(new Blob([card],{type:'text/vcard;charset=utf-8'}));
      const link=document.createElement('a');
      link.href=url;link.download='hysquib.vcf';document.body.appendChild(link);link.click();link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    });
  </script>
</body>
</html>

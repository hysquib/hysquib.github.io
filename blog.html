<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://*; connect-src 'self'; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">
    <title>博客 — hysquib</title>
    <meta name="description" content="关于技术、设计和软件工程的文章。">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-logo">hysquib<span>.</span></a>
            <ul class="nav-links">
                <li><a href="/" data-nav-home-text>首页</a></li>
                <li><a href="/blog.html" data-nav-blog-text>博客</a></li>
                <li><a href="/#about" data-nav-about-text>关于</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="page-header">
        <div class="container">
            <span class="eyebrow page-eyebrow fade-in">博客</span>
            <h1 class="page-title fade-in" style="animation-delay: 0.1s;">写作与想法</h1>
            <p class="page-description fade-in" style="animation-delay: 0.2s;">关于技术、设计和构建有意义事物的思考。</p>
        </div>
    </header>

    <!-- Blog List -->
    <main class="blog-list">
        <div class="container">
            <div class="posts-grid" id="blog-list">
                <div style="text-align: center; padding: 2rem; color: var(--text-dim);">
                    <span class="spinner"></span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <div class="footer-social" id="footer-social"></div>
                <p class="footer-copy"><span class="footer-copy-text">© <span id="year"></span> hysquib. 用心构建。</span></p>
            </div>
        </div>
    </footer>

    <script src="/js/config.js"></script>
    <script src="/js/blog.js"></script>
    <script src="/js/common.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 — hysquib</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css?v=20260804">
</head>
<body>

    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-logo">hysquib<span>.</span></a>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/blog.html">博客</a></li>
                <li><a href="/#about">关于</a></li>
                <li><a href="/admin.html">管理</a></li>
            </ul>
        </div>
    </nav>

    <!-- Post View -->
    <article class="post-view">
        <div class="container">
            <div class="content-width">
                <a href="/blog.html" class="post-back">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    返回博客
                </a>

                <div id="post-content" style="margin-top: 2rem;">
                    <div style="text-align: center; padding: 4rem 0; color: var(--text-dim);">
                        <span class="spinner"></span>
                        <p style="margin-top: 1rem;">正在加载文章...</p>
                    </div>
                </div>
            </div>
        </div>
    </article>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <div class="footer-social"></div>
                <p class="footer-copy">© hysquib.</p>
            </div>
        </div>
    </footer>

    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/js/site.js?v=20260804"></script>
    <script src="/js/config.js?v=20260804"></script>
    <script src="/js/blog.js?v=20260804"></script>
    <script>
        // 应用站点内容（导航、社交、页脚）
        SiteApp.init();
        // 渲染单篇文章
        BlogApp.renderSinglePost('post-content');
    </script>
</body>
</html>

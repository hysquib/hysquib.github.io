<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hysquib — 构建者 · 写作者 · 思考者</title>
    <meta name="description" content="关于技术、设计与构建有意义之物的个人思考。">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css?v=20260804">
</head>
<body>

    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-logo">hysquib<span>.</span></a>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/blog.html">博客</a></li>
                <li><a href="/#about">关于</a></li>
                <li><a href="/admin.html">管理</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero">
        <div class="hero-bg"></div>
        <div class="container">
            <div class="hero-content">
                <p class="hero-greeting">— 你好，我是</p>
                <h1>hysquib<br><span class="accent">一个构建者。</span></h1>
                <p class="hero-tagline">我写关于技术、设计与构建有意义之物的思考。这是我的互联网一角——一个存放想法、实验与真诚反思的地方。</p>
                <div class="hero-actions">
                    <a href="/blog.html" class="btn btn-primary">
                        阅读博客
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
                    </a>
                    <a href="#about" class="btn">关于我</a>
                </div>
            </div>
        </div>
    </header>

    <!-- About -->
    <section class="section" id="about">
        <div class="container">
            <div class="about-grid reveal">
                <div class="about-label">关于</div>
                <div class="about-text">
                    <p>我是一名开发者，相信优秀的软件诞生于工程纪律与设计感知的交汇之处。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Latest Posts -->
    <section class="section" style="padding-top: 0;">
        <div class="container">
            <div class="section-header reveal">
                <div>
                    <span class="eyebrow">写作</span>
                    <h2>最新文章</h2>
                </div>
                <a href="/blog.html" class="section-link">查看全部 →</a>
            </div>
            <div class="posts-grid" id="latest-posts">
                <div style="text-align: center; padding: 2rem; color: var(--text-dim);">
                    <span class="spinner"></span>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <div class="footer-social"></div>
                <p class="footer-copy">© hysquib. 用心构建。</p>
            </div>
        </div>
    </footer>

    <script src="/js/site.js?v=20260804"></script>
    <script src="/js/config.js?v=20260804"></script>
    <script src="/js/blog.js?v=20260804"></script>
    <script>
        // 渲染站点动态内容
        SiteApp.init({
            hero: true,
            about: true,
            latestPostsSection: true,
        }).then(() => {
            // 站点内容加载完成后，触发 reveal 动画
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });

        // 渲染最新文章
        BlogApp.renderLatestPosts('latest-posts', 3);
    </script>
</body>
</html>
